name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q dataops mlops

      - name: Validate Compose configuration
        run: docker compose config --quiet

  build-images:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DataOps image
        run: docker build -f docker/Dockerfile.dataops -t book-dataops:${{ github.sha }} .

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t book-api:${{ github.sha }} .

  deploy-komodo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo deployment
        env:
          KOMODO_DEPLOY_WEBHOOK_URL: ${{ secrets.KOMODO_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$KOMODO_DEPLOY_WEBHOOK_URL" ]; then
            echo "KOMODO_DEPLOY_WEBHOOK_URL is not configured; skipping deployment."
            exit 0
          fi
          curl --fail --show-error --silent -X POST "$KOMODO_DEPLOY_WEBHOOK_URL"