name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q dataops mlops

      - name: Validate Compose configuration
        run: docker compose config --quiet

  build-images:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DataOps image
        run: docker build -f docker/Dockerfile.dataops -t book-dataops:${{ github.sha }} .

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t book-api:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t book-frontend:${{ github.sha }} .

  deploy-komodo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo deployment
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          curl --fail --show-error --silent \
            -X POST "https://komodo.s3.fsbm.ma/execute" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            --data '{
              "type": "DeployStack",
              "params": {
                "stack": "systeme_de_recommandation_de_livres"
              }
            }'
